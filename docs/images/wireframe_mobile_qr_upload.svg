<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 920" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      .title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px; font-weight: 500; fill: #64748b; }
      .phone-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 800; fill: #ffffff; }
      .phone-label { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; fill: #475569; }
      .phone-text { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; fill: #0f172a; font-weight: 600; }
      .phone-badge { font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700; }
      .arrow-flow { stroke: #6366f1; stroke-width: 3; fill: none; stroke-linecap: round; stroke-dasharray: 6,6; }
    </style>
    <filter id="phone-shadow" x="-8%" y="-8%" width="116%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="phoneHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="940" height="920" rx="20" fill="#f8fafc" />
  <rect x="1" y="1" width="938" height="918" rx="19" fill="none" stroke="#e2e8f0" stroke-width="2" />

  <!-- Top Title Banner -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="44" height="44" rx="12" fill="#ede9fe" />
    <text x="12" y="30" font-size="22">📲</text>
    <text x="60" y="22" class="title">Wireframe: Alur Scan QR Code &amp; Mobile Web Upload dari HP</text>
    <text x="60" y="40" class="subtitle">Solusi Lapangan: Teknisi Scan QR dari Kertas SPK / Monitor ➔ Buka Kamera HP Langsung &amp; Kirim Progres</text>
  </g>

  <!-- ================= LEFT: TRIGGER SOURCES (PRINT SPK & DESKTOP) ================= -->
  <g transform="translate(40, 95)">
    <rect width="400" height="785" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)" />

    <!-- Section Header -->
    <path d="M 0 16 Q 0 0 16 0 L 384 0 Q 400 0 400 16 L 400 48 L 0 48 Z" fill="#334155" />
    <text x="20" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5px" font-weight="800" fill="#ffffff">SUMBER SCAN 1: KERTAS SPK CETAK &amp; MONITOR PC</text>

    <!-- 1. Kertas SPK Cetak Representation -->
    <g transform="translate(25, 70)">
      <rect width="350" height="315" rx="12" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5" />
      
      <!-- Purple Sidebar Slice -->
      <path d="M 0 12 Q 0 0 12 0 L 90 0 L 90 315 L 12 315 Q 0 315 0 303 Z" fill="#4f46e5" />
      <text x="12" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="10px" font-weight="800" fill="#ffffff">SPK R&amp;D</text>
      
      <!-- Mini QR on Physical Paper -->
      <rect x="10" y="50" width="70" height="70" rx="6" fill="#ffffff" />
      <!-- Simulated QR Pattern -->
      <rect x="15" y="55" width="22" height="22" fill="#0f172a" />
      <rect x="18" y="58" width="16" height="16" fill="#ffffff" />
      <rect x="21" y="61" width="10" height="10" fill="#0f172a" />

      <rect x="53" y="55" width="22" height="22" fill="#0f172a" />
      <rect x="56" y="58" width="16" height="16" fill="#ffffff" />
      <rect x="59" y="61" width="10" height="10" fill="#0f172a" />

      <rect x="15" y="93" width="22" height="22" fill="#0f172a" />
      <rect x="18" y="96" width="16" height="16" fill="#ffffff" />
      <rect x="21" y="99" width="10" height="10" fill="#0f172a" />

      <rect x="42" y="62" width="6" height="6" fill="#0f172a" />
      <rect x="45" y="80" width="12" height="6" fill="#0f172a" />
      <rect x="58" y="88" width="16" height="16" fill="#0f172a" />

      <text x="14" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="8px" font-weight="800" fill="#ffffff">SCAN HP</text>
      <text x="14" y="142" font-family="'Plus Jakarta Sans', sans-serif" font-size="8px" font-weight="800" fill="#ffffff">UPLOAD</text>

      <!-- SPK Body Text Preview -->
      <g transform="translate(105, 20)">
        <text x="0" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="12px" font-weight="800" fill="#0f172a">LEMBAR SPK BENGKEL</text>
        <text x="0" y="32" class="phone-badge" fill="#4338ca">NO: RD-2609-29-0001-CS1</text>
        <text x="0" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5px" font-weight="700" fill="#334155">Sepatu: Nike Air Jordan 1</text>
        
        <rect y="65" width="230" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0" />
        <text x="10" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5px" font-weight="700" fill="#4f46e5">📲 CARA CEPAT UPLOAD TEKNISI:</text>
        <text x="10" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="9px" fill="#475569">1. Buka kamera HP &amp; arahkan ke QR.</text>
        <text x="10" y="114" font-family="'Plus Jakarta Sans', sans-serif" font-size="9px" fill="#475569">2. Jepret foto progres &amp; klik kirim!</text>

        <rect y="135" width="230" height="40" rx="6" fill="#f1f5f9" />
        <text x="10" y="152" font-size="8.5px" fill="#64748b">Kertas ini disematkan di baki sepatu.</text>
        <text x="10" y="165" font-size="8.5px" fill="#64748b">Teknisi tidak perlu bolak-balik ke meja PC.</text>
      </g>
    </g>

    <!-- 2. Monitor PC Representation -->
    <g transform="translate(25, 410)">
      <rect width="350" height="340" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 36 L 0 36 Z" fill="#1e293b" />
      <text x="16" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11px" font-weight="800" fill="#ffffff">POPUP QR DI DETAIL ORDER PC (/admin/orders/{id})</text>
      
      <!-- Big QR Code Center -->
      <g transform="translate(100, 60)">
        <rect width="150" height="150" rx="12" fill="#ffffff" stroke="#818cf8" stroke-width="2" filter="url(#card-shadow)" />
        
        <!-- Big QR Pattern Mockup -->
        <rect x="15" y="15" width="40" height="40" fill="#0f172a" />
        <rect x="22" y="22" width="26" height="26" fill="#ffffff" />
        <rect x="28" y="28" width="14" height="14" fill="#0f172a" />

        <rect x="95" y="15" width="40" height="40" fill="#0f172a" />
        <rect x="102" y="22" width="26" height="26" fill="#ffffff" />
        <rect x="108" y="28" width="14" height="14" fill="#0f172a" />

        <rect x="15" y="95" width="40" height="40" fill="#0f172a" />
        <rect x="22" y="102" width="26" height="26" fill="#ffffff" />
        <rect x="28" y="108" width="14" height="14" fill="#0f172a" />

        <!-- Random blocks in center -->
        <rect x="65" y="20" width="18" height="10" fill="#4f46e5" />
        <rect x="65" y="45" width="20" height="20" fill="#0f172a" />
        <rect x="25" y="65" width="25" height="15" fill="#4f46e5" />
        <rect x="95" y="70" width="30" height="15" fill="#0f172a" />
        <rect x="65" y="105" width="25" height="25" fill="#4f46e5" />
        <rect x="105" y="105" width="25" height="15" fill="#0f172a" />
      </g>

      <text x="175" y="235" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12px" font-weight="800" fill="#0f172a">Scan QR Code dengan Kamera HP</text>
      <text x="175" y="252" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10px" fill="#64748b">Akses form instan tanpa perlu repot login di HP teknisi</text>
      
      <rect x="45" y="268" width="260" height="34" rx="8" fill="#ede9fe" />
      <text x="175" y="289" text-anchor="middle" class="phone-badge" fill="#4338ca">https://workshop.test/rnd-upload/token_8f91</text>
    </g>
  </g>

  <!-- CONNECTOR ARROW (CENTER FLOW) -->
  <g transform="translate(440, 430)">
    <path d="M 0 50 Q 30 20 60 50" class="arrow-flow" />
    <polygon points="63 53, 50 43, 53 58" fill="#4f46e5" />
    <rect x="-10" y="-10" width="80" height="26" rx="6" fill="#4f46e5" />
    <text x="30" y="7" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5px" font-weight="800" fill="#ffffff">SCAN HP 📱</text>
  </g>

  <!-- ================= RIGHT: SMARTPHONE SCREEN MOCKUP ================= -->
  <g transform="translate(510, 85)" filter="url(#phone-shadow)">
    <!-- Phone Outer Body (iPhone / Modern Android) -->
    <rect width="390" height="800" rx="40" fill="#0f172a" />
    <rect x="8" y="8" width="374" height="784" rx="32" fill="#ffffff" />

    <!-- Speaker Notch & Dynamic Island -->
    <rect x="135" y="18" width="120" height="22" rx="11" fill="#0f172a" />
    <circle cx="160" cy="29" r="4.5" fill="#1e293b" />
    <circle cx="225" cy="29" r="4" fill="#1e293b" />

    <!-- Phone Screen Content Header -->
    <g transform="translate(8, 48)">
      <path d="M 0 0 L 374 0 L 374 72 L 0 72 Z" fill="url(#phoneHeaderGrad)" />
      
      <text x="20" y="26" class="phone-title">Upload Progres R&amp;D (HP)</text>
      <text x="20" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="11px" font-weight="600" fill="#e0e7ff">SPK #RD-2609-29-0001-CS1</text>
      <text x="20" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5px" fill="#c7d2fe">Nike AJ1 • Proyek Cat Flexi V2 • Teknisi: Budi</text>

      <rect x="270" y="16" width="85" height="22" rx="6" fill="#ffffff" fill-opacity="0.2" />
      <text x="278" y="31" class="phone-badge" fill="#ffffff">🟢 AKTIF</text>
    </g>

    <!-- Phone Inner Form Body -->
    <g transform="translate(24, 135)">
      
      <!-- 1. BIG CAMERA CAPTURE BUTTON (MAIN HIGHLIGHT) -->
      <g>
        <rect width="342" height="155" rx="14" fill="#f5f3ff" stroke="#818cf8" stroke-width="2" stroke-dasharray="6,6" />
        
        <circle cx="171" cy="55" r="28" fill="#4f46e5" />
        <text x="156" y="64" font-size="26">📸</text>

        <text x="171" y="105" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13px" font-weight="800" fill="#312e81">AMBIL FOTO DARI KAMERA HP</text>
        <text x="171" y="123" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10px" font-weight="600" fill="#6366f1">Klik di sini untuk langsung menyalakan kamera bawaan HP</text>
        <text x="171" y="139" text-anchor="middle" font-size="8.5px" fill="#94a3b8">Bisa langsung jepret atau pilih dari Galeri foto</text>
      </g>

      <!-- 2. Input Judul / Tahap Riset -->
      <g transform="translate(0, 175)">
        <text x="0" y="12" class="phone-label">1. Tahap / Judul Eksperimen <tspan fill="#ef4444">*</tspan></text>
        <rect y="20" width="342" height="42" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
        <text x="14" y="46" class="phone-text">Aplikasi Formula Cat Lapisan Ke-2</text>
      </g>

      <!-- 3. Pilihan Status Hasil Uji (Tombol Sentuh Besar) -->
      <g transform="translate(0, 255)">
        <text x="0" y="12" class="phone-label">2. Status Hasil Uji Tahap Ini <tspan fill="#ef4444">*</tspan></text>
        
        <!-- Big Touch Grid -->
        <g transform="translate(0, 20)">
          <!-- Option A: In Progress -->
          <rect width="164" height="38" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" />
          <text x="25" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5px" font-weight="800" fill="#1d4ed8">🔵 SEDANG DIUJI</text>

          <!-- Option B: Lolos -->
          <g transform="translate(178, 0)">
            <rect width="164" height="38" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" />
            <text x="25" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5px" font-weight="700" fill="#065f46">🟢 LOLOS / BAGUS</text>
          </g>

          <!-- Option C: Perlu Revisi -->
          <g transform="translate(0, 46)">
            <rect width="164" height="38" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5" />
            <text x="25" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5px" font-weight="700" fill="#92400e">🟡 PERLU REVISI</text>
          </g>

          <!-- Option D: Gagal -->
          <g transform="translate(178, 46)">
            <rect width="164" height="38" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" />
            <text x="25" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5px" font-weight="700" fill="#991b1b">🔴 GAGAL TRIAL</text>
          </g>
        </g>
      </g>

      <!-- 4. Catatan Formula & Voice-to-Text -->
      <g transform="translate(0, 385)">
        <text x="0" y="12" class="phone-label">3. Catatan Formula &amp; Bahan (Notes)</text>
        <rect y="20" width="342" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
        <text x="14" y="42" class="phone-text">Formula: 70% Polyurethane + 30% Pigment.</text>
        <text x="14" y="60" class="phone-text">Daya rekat sangat kuat. Mengering rata</text>
        <text x="14" y="78" class="phone-text">setelah 3 jam tanpa retak.</text>

        <!-- Voice Dictation Hint Box -->
        <rect x="12" y="90" width="318" height="26" rx="6" fill="#ede9fe" />
        <text x="25" y="107" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5px" font-weight="700" fill="#4f46e5">🎤 Tip: Gunakan tombol mic di keyboard HP untuk mendikte!</text>
      </g>

      <!-- 5. Big Submit Button at Bottom -->
      <g transform="translate(0, 535)">
        <rect width="342" height="52" rx="14" fill="#4f46e5" />
        <text x="171" y="32" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14px" font-weight="800" fill="#ffffff">🚀 KIRIM PROGRES RISET SEKARANG</text>
        <text x="171" y="70" text-anchor="middle" font-size="9px" fill="#94a3b8">Otomatis ter-update pada Living Report &amp; Detail Order Desktop</text>
      </g>

    </g>

    <!-- Phone Home Bar (Indicator) -->
    <rect x="135" y="776" width="120" height="4" rx="2" fill="#0f172a" fill-opacity="0.3" />
  </g>
</svg>
