<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 840" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      .title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 19px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px; font-weight: 500; fill: #64748b; }
      .paper-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12.5px; font-weight: 800; fill: #ffffff; }
      .spk-header { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 800; fill: #0f172a; }
      .mono-code { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; }
      .meta-lbl { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 9.5px; font-weight: 700; color: #64748b; fill: #64748b; text-transform: uppercase; }
      .meta-val { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
      .sticker-code { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 800; fill: #b45309; }
      .sticker-brand { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10px; font-weight: 800; fill: #0f172a; }
      .sticker-meta { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 8.5px; font-weight: 600; fill: #475569; }
    </style>
    <filter id="paper-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="840" rx="20" fill="#f8fafc"/>
  <rect x="1" y="1" width="958" height="838" rx="19" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Top Title Banner -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="46" height="46" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
    <text x="12" y="32" font-size="24">🖨️</text>
    <text x="62" y="22" class="title">Spesifikasi Cetak Fisik Hybrid: SPK Induk Batch &amp; Stiker Barcode Satuan</text>
    <text x="62" y="42" class="subtitle">Desain Berstandar Pabrik/B2B: 1 Lembar A4 (Kardus Master/Map Proyek) + Lembar Grid Label Barcode per Pasang</text>
  </g>

  <!-- ================= LEFT: 1 LEMBAR SPK INDUK BATCH A4 ================= -->
  <g transform="translate(40, 95)" filter="url(#paper-shadow)">
    <!-- Simulated A4 Paper (Ratio ~1:1.41) -->
    <rect width="470" height="705" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Left Amber Gold Sidebar (Identity for B2B Brand) -->
    <path d="M 0 8 Q 0 0 8 0 L 105 0 L 105 705 L 8 705 Q 0 705 0 697 Z" fill="#d97706"/>

    <!-- Vertical Sidebar Content -->
    <g transform="translate(16, 25)">
      <!-- Logo icon -->
      <rect x="12" y="0" width="48" height="48" rx="10" fill="#ffffff"/>
      <text x="22" y="33" font-size="24">🏷️</text>
      <text x="10" y="70" class="paper-title" style="font-size: 11px;">SPK BRAND</text>
      <text x="10" y="85" font-family="'JetBrains Mono', monospace" font-size="8.5px" fill="#fef3c7">B2B PARTNERSHIP</text>

      <!-- Big QR Code for Batch Tracking -->
      <g transform="translate(6, 120)">
        <rect width="64" height="64" rx="6" fill="#ffffff"/>
        <!-- Simulated QR Pattern -->
        <rect x="5" y="5" width="22" height="22" fill="#0f172a"/>
        <rect x="8" y="8" width="16" height="16" fill="#ffffff"/>
        <rect x="11" y="11" width="10" height="10" fill="#0f172a"/>

        <rect x="37" y="5" width="22" height="22" fill="#0f172a"/>
        <rect x="40" y="8" width="16" height="16" fill="#ffffff"/>
        <rect x="43" y="11" width="10" height="10" fill="#0f172a"/>

        <rect x="5" y="37" width="22" height="22" fill="#0f172a"/>
        <rect x="8" y="40" width="16" height="16" fill="#ffffff"/>
        <rect x="11" y="43" width="10" height="10" fill="#0f172a"/>

        <rect x="33" y="33" width="7" height="7" fill="#0f172a"/>
        <rect x="45" y="40" width="14" height="19" fill="#0f172a"/>
      </g>
      <text x="6" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5px" font-weight="700" fill="#ffffff">SCAN STATUS BATCH</text>

      <!-- Vertical Text -->
      <g transform="translate(22, 235)">
        <text transform="rotate(90)" font-family="'Plus Jakarta Sans', sans-serif" font-size="9px" font-weight="800" fill="#fef3c7" letter-spacing="0.18em">
          SHOE WORKSHOP B2B DIVISION
        </text>
      </g>
    </g>

    <!-- Main Body of SPK Induk Paper -->
    <g transform="translate(120, 20)">
      <!-- Company Header -->
      <text x="0" y="16" class="spk-header">SURAT PERINTAH KERJA (SPK) INDUK</text>
      <text x="0" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5px" font-weight="600" fill="#b45309">
        DIVISI KEMITRAAN BRAND (B2B BATCH INBOUND)
      </text>

      <!-- Badge No SPK Induk -->
      <g transform="translate(0, 42)">
        <rect width="330" height="38" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
        <text x="12" y="18" class="meta-lbl">NOMOR BATCH SPK INDUK:</text>
        <text x="12" y="32" class="mono-code" style="font-size: 13px; fill: #d97706;">BR-2609-30-0001</text>

        <rect x="225" y="8" width="95" height="22" rx="4" fill="#d97706"/>
        <text x="233" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="9px" font-weight="800" fill="#ffffff">TOTAL: 50 PSG</text>
      </g>

      <!-- Metadata Grid -->
      <g transform="translate(0, 95)">
        <rect width="330" height="90" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
        
        <!-- Row 1 -->
        <text x="12" y="18" class="meta-lbl">MITRA BRAND:</text>
        <text x="12" y="34" class="meta-val">VENTELA INDONESIA</text>

        <text x="180" y="18" class="meta-lbl">NO PO / SURAT JALAN:</text>
        <text x="180" y="34" class="mono-code" style="fill: #0284c7;">VNTL-PO-8821</text>

        <!-- Row 2 -->
        <text x="12" y="58" class="meta-lbl">TANGGAL MASUK:</text>
        <text x="12" y="74" class="meta-val">30 Sep 2026</text>

        <text x="180" y="58" class="meta-lbl">TARGET DEADLINE:</text>
        <text x="180" y="74" class="meta-val" fill="#ea580c">05 Okt 2026</text>
      </g>

      <!-- Size Breakdown Table Section -->
      <g transform="translate(0, 200)">
        <text x="0" y="14" class="meta-lbl" style="font-size: 10.5px; fill: #0f172a;">RINCIAN MODEL &amp; MATRIKS UKURAN:</text>
        
        <!-- Table Box -->
        <rect y="22" width="330" height="150" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
        
        <!-- Table Header -->
        <rect y="22" width="330" height="24" rx="4" fill="#f1f5f9"/>
        <text x="10" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9px" font-weight="700" fill="#475569">MODEL / WARNA</text>
        <text x="160" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9px" font-weight="700" fill="#475569">LAYANAN</text>
        <text x="270" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9px" font-weight="700" fill="#475569">QTY</text>

        <!-- Row Content -->
        <text x="10" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="10px" font-weight="700" fill="#0f172a">Basic Low (Black/Natural)</text>
        <text x="160" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="9px" fill="#334155">Sole Reglue + Stitch</text>
        <text x="270" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="10px" font-weight="800" fill="#d97706">50 psg</text>

        <!-- Inner Matrix Distribution -->
        <g transform="translate(10, 78)">
          <rect width="310" height="42" rx="4" fill="#fffbeb" stroke="#fde68a"/>
          <text x="8" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5px" font-weight="700" fill="#b45309">SEBARAN SIZE (UKURAN):</text>
          <text x="8" y="32" font-family="'JetBrains Mono', monospace" font-size="9.5px" font-weight="700" fill="#0f172a">
            [38: 5]  [39: 10]  [40: 15]  [41: 12]  [42: 8]
          </text>
        </g>

        <!-- Special Notes -->
        <text x="10" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5px" font-weight="600" fill="#64748b">
          *Instruksi: Rekatkan sol menggunakan lem tahan panas V2.
        </text>
      </g>

      <!-- Checklist Stasiun Pengerjaan -->
      <g transform="translate(0, 390)">
        <text x="0" y="14" class="meta-lbl">LOG PROGRESS STASIUN BENGKEL:</text>
        <rect y="22" width="330" height="75" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
        
        <g transform="translate(12, 42)">
          <rect width="12" height="12" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="20" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-size="9px" font-weight="600">1. Unboxing &amp; Prep</text>
        </g>
        <g transform="translate(120, 42)">
          <rect width="12" height="12" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="20" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-size="9px" font-weight="600">2. Sortir Bahan</text>
        </g>
        <g transform="translate(225, 42)">
          <rect width="12" height="12" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="20" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-size="9px" font-weight="600">3. Sol &amp; Jahit</text>
        </g>

        <g transform="translate(12, 70)">
          <rect width="12" height="12" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="20" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-size="9px" font-weight="600">4. Finishing QC</text>
        </g>
        <g transform="translate(120, 70)">
          <rect width="12" height="12" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="20" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-size="9px" font-weight="600">5. Packing Kardus</text>
        </g>
        <g transform="translate(225, 70)">
          <rect width="12" height="12" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="20" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-size="9px" font-weight="600">6. Dispatch Kirim</text>
        </g>
      </g>

      <!-- Signature Approval Box -->
      <g transform="translate(0, 505)">
        <g transform="translate(0, 0)">
          <rect width="100" height="60" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="14" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="8px" font-weight="700" fill="#64748b">ADMIN BATCH</text>
          <line x1="10" y1="46" x2="90" y2="46" stroke="#e2e8f0"/>
        </g>
        <g transform="translate(115, 0)">
          <rect width="100" height="60" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="10" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="8px" font-weight="700" fill="#64748b">KEPALA PRODUKSI</text>
          <line x1="10" y1="46" x2="90" y2="46" stroke="#e2e8f0"/>
        </g>
        <g transform="translate(230, 0)">
          <rect width="100" height="60" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="20" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="8px" font-weight="700" fill="#64748b">FINAL QC AUDIT</text>
          <line x1="10" y1="46" x2="90" y2="46" stroke="#e2e8f0"/>
        </g>
      </g>
    </g>
  </g>

