        <text x="0" y="38" class="sticker-meta">UKURAN: <tspan font-weight="800" fill="#b45309" font-size="11px">SIZE 38</tspan> | Sol Reglue</text>
        <text x="0" y="54" class="sticker-meta">PO: VNTL-PO-8821 • Batch #1</text>
      </g>

