        <rect x="77" y="0" width="3" height="45" fill="#0f172a"/>
        <text x="14" y="60" font-family="'JetBrains Mono', monospace" font-size="8.5px" font-weight="700" fill="#475569">
          *BR260930000102*
        </text>
      </g>
    </g>

    <!-- Sticker Grid 3: Item #03 -->
    <g transform="translate(16, 304)">
      <rect width="348" height="98" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <path d="M 0 8 Q 0 0 8 0 L 14 0 L 14 98 L 8 98 Q 0 98 0 90 Z" fill="#d97706"/>

