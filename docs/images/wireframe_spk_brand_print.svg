        <rect x="46" y="0" width="3.5" height="45" fill="#0f172a"/>
        <rect x="52" y="0" width="1.5" height="45" fill="#0f172a"/>
        <rect x="56" y="0" width="4" height="45" fill="#0f172a"/>
        <rect x="62" y="0" width="2" height="45" fill="#0f172a"/>
        <rect x="66" y="0" width="5" height="45" fill="#0f172a"/>
        <rect x="73" y="0" width="2" height="45" fill="#0f172a"/>
        <rect x="77" y="0" width="3" height="45" fill="#0f172a"/>

        <text x="14" y="60" font-family="'JetBrains Mono', monospace" font-size="8.5px" font-weight="700" fill="#475569">
