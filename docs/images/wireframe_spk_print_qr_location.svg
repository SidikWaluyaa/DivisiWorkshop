<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 650" width="950" height="650" style="background:#0f172a; font-family:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="shadowPrint" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="gradEmeraldSidebar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22b086"/>
      <stop offset="100%" stop-color="#188967"/>
    </linearGradient>
  </defs>

  <!-- Title Top -->
  <text x="40" y="32" fill="#22b086" font-size="11" font-weight="800" letter-spacing="2">MOCKUP LEMBAR FISIK PRINT SPK</text>
  <text x="40" y="55" fill="#ffffff" font-size="16" font-weight="800">Posisi Penempatan QR Code Scanner Kontrol Teknisi di Sidebar Kiri SPK</text>

  <!-- Paper Container (A4 Miniatur Mockup) -->
  <g transform="translate(40, 75)" filter="url(#shadowPrint)">
    <!-- White Paper -->
    <rect width="870" height="545" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- LEFT SIDEBAR (Width: 260px) -->
    <g>
      <rect width="260" height="545" rx="8" fill="url(#gradEmeraldSidebar)"/>
      <rect x="252" width="8" height="545" fill="url(#gradEmeraldSidebar)"/> <!-- square corner fix -->

      <!-- Sidebar Header -->
      <text x="24" y="34" fill="#ffffff" font-size="11" font-weight="900" letter-spacing="1">SHOE WORKSHOP</text>
      <text x="24" y="48" fill="#ffffff" opacity="0.8" font-size="9" font-weight="600">Form SPK Customer</text>

      <!-- Shoe Photo Box -->
      <g transform="translate(20, 62)">
        <rect width="220" height="135" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.2"/>
        <circle cx="110" cy="60" r="18" fill="#334155"/>
        <text x="110" y="65" fill="#94a3b8" font-size="14" text-anchor="middle">👟</text>
        <text x="110" y="92" fill="#64748b" font-size="8" font-weight="800" letter-spacing="1" text-anchor="middle">FOTO SEPATU</text>

        <!-- Size Badge Top Right -->
        <rect x="175" y="8" width="36" height="36" rx="6" fill="#ffffff"/>
        <text x="193" y="20" fill="#94a3b8" font-size="6" font-weight="800" text-anchor="middle">SIZE</text>
        <text x="193" y="36" fill="#0f172a" font-size="13" font-weight="900" text-anchor="middle">42</text>
      </g>

      <!-- HIGHLIGHT: QR CODE SCAN KONTROL TEKNISI (NEW COMPONENT) -->
      <g transform="translate(18, 208)">
        <!-- Highlight Callout Box -->
        <rect width="224" height="135" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
        <rect width="224" height="24" rx="8" fill="#f59e0b"/>
        
        <!-- Header QR -->
        <text x="112" y="16" fill="#ffffff" font-size="9.5" font-weight="900" letter-spacing="0.5" text-anchor="middle">📱 SCAN KONTROL TEKNISI</text>
        
        <!-- QR Visual (Vector simulation) -->
        <g transform="translate(18, 32)">
          <rect width="72" height="72" rx="4" fill="#0f172a"/>
          <!-- QR matrix elements -->
          <rect x="6" y="6" width="22" height="22" fill="#ffffff"/>
          <rect x="10" y="10" width="14" height="14" fill="#0f172a"/>
          <rect x="13" y="13" width="8" height="8" fill="#ffffff"/>

          <rect x="44" y="6" width="22" height="22" fill="#ffffff"/>
          <rect x="48" y="10" width="14" height="14" fill="#0f172a"/>
          <rect x="51" y="13" width="8" height="8" fill="#ffffff"/>

          <rect x="6" y="44" width="22" height="22" fill="#ffffff"/>
          <rect x="10" y="48" width="14" height="14" fill="#0f172a"/>
          <rect x="13" y="51" width="8" height="8" fill="#ffffff"/>

          <rect x="34" y="34" width="6" height="6" fill="#ffffff"/>
          <rect x="44" y="44" width="10" height="10" fill="#ffffff"/>
          <rect x="58" y="34" width="8" height="8" fill="#ffffff"/>
          <rect x="34" y="56" width="12" height="10" fill="#ffffff"/>
          <rect x="52" y="52" width="14" height="14" fill="#ffffff"/>
        </g>

        <!-- Right Label Beside QR -->
        <g transform="translate(100, 36)">
          <text x="0" y="14" fill="#0f172a" font-size="10" font-weight="800">Mulai Kerja</text>
          <text x="0" y="28" fill="#059669" font-size="8.5" font-weight="700">▶ Catat Waktu</text>
          <text x="0" y="42" fill="#0f172a" font-size="10" font-weight="800">Selesai</text>
          <text x="0" y="56" fill="#e11d48" font-size="8.5" font-weight="700">⏹ Lead Time</text>
        </g>

        <rect x="12" y="110" width="200" height="18" rx="4" fill="#f1f5f9"/>
        <text x="112" y="122" fill="#475569" font-size="7.5" font-weight="700" text-anchor="middle">Arahkan kamera HP ke kode QR di atas</text>
      </g>

      <!-- Keterangan Besar -->
      <g transform="translate(20, 355)">
        <text x="0" y="10" fill="#ffffff" font-size="8.5" font-weight="900" letter-spacing="0.5">KETERANGAN BESAR :</text>
        <rect y="16" width="220" height="68" rx="6" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
        <rect x="10" y="24" width="110" height="20" rx="4" fill="#ffffff"/>
        <text x="65" y="37" fill="#188967" font-size="9" font-weight="900" text-anchor="middle">3 HK - Non-Garansi</text>
      </g>

      <!-- Catatan Gudang -->
      <g transform="translate(20, 448)">
        <rect width="220" height="65" rx="6" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
        <rect width="220" height="18" rx="6" fill="#ffffff" fill-opacity="0.15"/>
        <text x="110" y="13" fill="#ffc232" font-size="7.5" font-weight="900" letter-spacing="1" text-anchor="middle">CATATAN GUDANG</text>
        <text x="110" y="42" fill="#ffffff" opacity="0.6" font-size="8" font-weight="700" text-anchor="middle">- BELUM ADA CATATAN -</text>
      </g>

      <!-- Footer Brand -->
      <text x="24" y="534" fill="#ffffff" font-size="7.5" font-weight="800">#<tspan fill="#ffc232">living</tspan>with PASSION</text>
    </g>

    <!-- RIGHT MAIN CONTENT (Width: 610px) -->
    <g transform="translate(280, 20)">
      <!-- Top Row: SPK Number & Accessories -->
      <g>
        <!-- SPK Box -->
        <rect width="280" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="14" y="18" fill="#94a3b8" font-size="8" font-weight="800">NOMOR SPK</text>
        <text x="14" y="40" fill="#22b086" font-size="17" font-weight="900" font-family="monospace">S-2608-12-0004-SW</text>

        <!-- Customer Name -->
        <rect y="60" width="280" height="38" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="14" y="74" fill="#94a3b8" font-size="8" font-weight="800">NAMA CUSTOMER</text>
        <text x="14" y="90" fill="#0f172a" font-size="11" font-weight="900">Budi FastTrack</text>

        <!-- Address -->
        <rect y="106" width="280" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="14" y="120" fill="#94a3b8" font-size="7.5" font-weight="800">ALAMAT LENGKAP</text>
        <text x="14" y="136" fill="#475569" font-size="8.5" font-weight="600">Gg. Cepat No. 7, Jakarta</text>
      </g>

      <!-- Accessories Box -->
      <g transform="translate(295, 0)">
        <rect width="275" height="148" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="14" y="20" fill="#22b086" font-size="9" font-weight="900">ACCESSORIES</text>
        <rect x="14" y="32" width="70" height="26" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="49" y="49" fill="#0f172a" font-size="9" font-weight="800" text-anchor="middle">INS : T</text>

        <rect x="94" y="32" width="70" height="26" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="129" y="49" fill="#0f172a" font-size="9" font-weight="800" text-anchor="middle">TALI : T</text>

        <rect x="174" y="32" width="70" height="26" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="209" y="49" fill="#0f172a" font-size="9" font-weight="800" text-anchor="middle">BOX : T</text>
      </g>

      <!-- Jasa Pengerjaan Section -->
      <g transform="translate(0, 165)">
        <text x="0" y="16" fill="#ffc232" font-size="9.5" font-weight="900">JASA PENGERJAAN :</text>
        
        <rect y="24" width="570" height="34" rx="6" fill="#ffc232"/>
        <text x="14" y="45" fill="#0f172a" font-size="11" font-weight="900">1. SOL-JADI/CUPSOLE</text>
        <rect x="380" y="28" width="90" height="24" rx="4" fill="#0f172a" fill-opacity="0.1"/>
        <text x="425" y="44" fill="#0f172a" font-size="8.5" font-weight="800" text-anchor="middle">REPARASI SOL</text>
        <rect x="478" y="28" width="85" height="24" rx="4" fill="#0f172a" fill-opacity="0.1"/>
        <text x="520" y="44" fill="#0f172a" font-size="8.5" font-weight="800" text-anchor="middle">PROSES WORKSHOP</text>

        <!-- QC & Paraf box -->
        <rect x="520" y="65" width="18" height="18" rx="3" fill="#ffffff" stroke="#22b086" stroke-width="1.5"/>
        <text x="529" y="94" fill="#94a3b8" font-size="7" font-weight="800" text-anchor="middle">QC</text>
        <line x1="545" y1="80" x2="570" y2="80" stroke="#cbd5e1" stroke-width="1.5"/>
        <text x="557" y="94" fill="#94a3b8" font-size="7" font-weight="800" text-anchor="middle">PARAF</text>
      </g>

      <!-- Form Manual Section -->
      <g transform="translate(0, 290)">
        <rect width="570" height="110" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
        <rect width="570" height="26" rx="8" fill="#f1f5f9"/>
        <text x="14" y="17" fill="#0f172a" font-size="8" font-weight="900">FORM MANUAL</text>
        <text x="130" y="17" fill="#475569" font-size="8" font-weight="700">☐ TAMBAH JASA     ☐ OTO     ☐ REVISI</text>
      </g>

      <!-- Dates Box -->
      <g transform="translate(0, 420)">
        <rect width="180" height="48" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="14" y="18" fill="#94a3b8" font-size="7.5" font-weight="800">SPK MASUK :</text>

        <rect x="195" y="0" width="180" height="48" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
        <text x="209" y="18" fill="#166534" font-size="7.5" font-weight="800">ESTIMASI SELESAI :</text>
        <text x="209" y="36" fill="#15803d" font-size="10" font-weight="900">15 AGUSTUS 2026</text>

        <rect x="390" y="0" width="180" height="48" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="404" y="18" fill="#94a3b8" font-size="7.5" font-weight="800">SPK KELUAR :</text>
      </g>

      <!-- Footer Right -->
      <text x="0" y="500" fill="#22b086" font-size="8.5" font-weight="900">SHOE WORKSHOP PREMIUM</text>
      <text x="500" y="500" fill="#94a3b8" font-size="8.5" font-weight="600">#morethanrepair</text>
    </g>
  </g>
</svg>
