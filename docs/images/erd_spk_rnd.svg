<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 760" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      .title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px; font-weight: 500; fill: #64748b; }
      .table-header { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12.5px; font-weight: 800; fill: #ffffff; letter-spacing: 0.05em; }
      .col-name { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; fill: #0f172a; }
      .col-type { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500; fill: #64748b; }
      .col-pk { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 800; fill: #d97706; }
      .col-fk { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 800; fill: #2563eb; }
      .col-highlight { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 800; fill: #4f46e5; }
      .rel-line { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-dasharray: 4,4; }
      .rel-line-solid { stroke: #6366f1; stroke-width: 2.5; fill: none; }
      .rel-label { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10px; font-weight: 700; fill: #475569; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="940" height="760" rx="20" fill="#ffffff" />
  <rect x="1" y="1" width="938" height="758" rx="19" fill="none" stroke="#e2e8f0" stroke-width="2" />

  <!-- Document Header -->
  <g transform="translate(40, 35)">
    <rect x="0" y="0" width="44" height="44" rx="12" fill="#ede9fe" />
    <text x="12" y="30" font-size="22">🗄️</text>
    <text x="60" y="22" class="title">Diagram Skema Relasi Database (ERD) SPK R&amp;D</text>
    <text x="60" y="40" class="subtitle">Skema Mandiri: work_orders Tanpa Tambahan Kolom • Progres &amp; Link di work_order_rnd_progress</text>
  </g>

  <!-- RELATIONSHIP LINES -->
  <!-- cs_leads to cs_spk -->
  <path d="M 290 200 L 360 200" class="rel-line-solid" />
  <text x="298" y="190" class="rel-label">1 : N</text>

  <!-- cs_spk to cs_spk_items -->
  <path d="M 500 370 L 500 420 L 160 420 L 160 480" class="rel-line" />
  <text x="250" y="412" class="rel-label">1 : N (Items)</text>

  <!-- cs_spk to work_orders (HANDOVER) -->
  <path d="M 640 200 L 690 200" class="rel-line-solid" stroke="#4f46e5" />
  <text x="643" y="190" class="rel-label" fill="#4f46e5">HANDOVER</text>

  <!-- work_orders to work_order_rnd_progress (NEW TABLE) -->
  <path d="M 800 370 L 800 430 L 510 430 L 510 470" class="rel-line-solid" stroke="#4f46e5" />
  <text x="540" y="422" class="rel-label" fill="#4f46e5">1 : N (TABEL BARU R&amp;D PROGRES &amp; LINK)</text>

  <!-- work_orders to work_order_logs -->
  <path d="M 880 370 L 880 480" class="rel-line" stroke="#059669" />
  <text x="830" y="450" class="rel-label" fill="#059669">AUDIT LOG</text>

  <!-- ================= ENTITAS 1: cs_leads ================= -->
  <g transform="translate(40, 110)">
    <rect width="250" height="230" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <!-- Header -->
    <path d="M 0 12 Q 0 0 12 0 L 238 0 Q 250 0 250 12 L 250 36 L 0 36 Z" fill="#334155" />
    <text x="14" y="24" class="table-header">cs_leads (Leads Pelanggan)</text>
    <!-- Columns -->
    <g transform="translate(14, 56)">
      <text x="0" y="0" class="col-name"><tspan class="col-pk">PK </tspan>id</text><text x="160" y="0" class="col-type">BIGINT</text>
      <text x="0" y="24" class="col-name">customer_name</text><text x="160" y="24" class="col-type">VARCHAR</text>
      <text x="0" y="48" class="col-name">customer_phone</text><text x="160" y="48" class="col-type">VARCHAR</text>
      <text x="0" y="72" class="col-name">source</text><text x="160" y="72" class="col-type">VARCHAR</text>
      <text x="0" y="96" class="col-name">status</text><text x="160" y="96" class="col-type">VARCHAR</text>
      <text x="0" y="120" class="col-name">priority</text><text x="160" y="120" class="col-type">ENUM</text>
      <text x="0" y="144" class="col-name">created_at</text><text x="160" y="144" class="col-type">DATETIME</text>
    </g>
  </g>

  <!-- ================= ENTITAS 2: cs_spk ================= -->
  <g transform="translate(360, 100)">
    <rect width="280" height="260" rx="12" fill="#ffffff" stroke="#818cf8" stroke-width="2" filter="url(#shadow)" />
    <!-- Header -->
    <path d="M 0 12 Q 0 0 12 0 L 268 0 Q 280 0 280 12 L 280 38 L 0 38 Z" fill="#4338ca" />
    <text x="14" y="25" class="table-header">cs_spk (Draft SPK CS)</text>
    <!-- Columns -->
    <g transform="translate(14, 58)">
      <text x="0" y="0" class="col-name"><tspan class="col-pk">PK </tspan>id</text><text x="180" y="0" class="col-type">BIGINT</text>
      <text x="0" y="24" class="col-name"><tspan class="col-fk">FK </tspan>cs_lead_id</text><text x="180" y="24" class="col-type">BIGINT</text>
      
      <!-- Highlighted SPK Number -->
      <rect x="-4" y="34" width="260" height="22" rx="4" fill="#ede9fe" />
      <text x="0" y="48" class="col-highlight">spk_number (RD-...)</text><text x="180" y="48" class="col-type">VARCHAR</text>
      
      <!-- Highlighted Priority -->
      <rect x="-4" y="58" width="260" height="22" rx="4" fill="#ede9fe" />
      <text x="0" y="72" class="col-highlight">priority ('R&amp;D')</text><text x="180" y="72" class="col-type">VARCHAR</text>
      
      <text x="0" y="96" class="col-name">total_price</text><text x="180" y="96" class="col-type">DECIMAL</text>
      <text x="0" y="120" class="col-name">special_instructions</text><text x="180" y="120" class="col-type">TEXT</text>
      <text x="0" y="144" class="col-name">status</text><text x="180" y="144" class="col-type">VARCHAR</text>
      <text x="0" y="168" class="col-name">created_at</text><text x="180" y="168" class="col-type">DATETIME</text>
    </g>
  </g>

  <!-- ================= ENTITAS 3: work_orders (ZERO NEW COLUMNS) ================= -->
  <g transform="translate(690, 100)">
    <rect width="220" height="260" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2" filter="url(#shadow)" />
    <!-- Header -->
    <path d="M 0 12 Q 0 0 12 0 L 208 0 Q 220 0 220 12 L 220 38 L 0 38 Z" fill="#0f172a" />
    <text x="14" y="25" class="table-header">work_orders (Tanpa Kolom Baru)</text>
    <!-- Columns -->
    <g transform="translate(14, 58)">
      <text x="0" y="0" class="col-name"><tspan class="col-pk">PK </tspan>id</text><text x="135" y="0" class="col-type">BIGINT</text>
      
      <rect x="-4" y="10" width="200" height="22" rx="4" fill="#f1f5f9" />
      <text x="0" y="24" class="col-name">spk_number (RD-...)</text><text x="135" y="24" class="col-type">VARCHAR</text>

      <rect x="-4" y="34" width="200" height="22" rx="4" fill="#f1f5f9" />
      <text x="0" y="48" class="col-name">priority ('R&amp;D')</text><text x="135" y="48" class="col-type">VARCHAR</text>

      <text x="0" y="72" class="col-name">customer_name</text><text x="135" y="72" class="col-type">VARCHAR</text>
      <text x="0" y="96" class="col-name">status</text><text x="135" y="96" class="col-type">VARCHAR</text>
      <text x="0" y="120" class="col-name">notes</text><text x="135" y="120" class="col-type">TEXT</text>
      <text x="0" y="144" class="col-name">entry_date</text><text x="135" y="144" class="col-type">DATETIME</text>
      <text x="0" y="168" class="col-name">created_at</text><text x="135" y="168" class="col-type">DATETIME</text>
    </g>
  </g>

  <!-- ================= ENTITAS 4: cs_spk_items ================= -->
  <g transform="translate(40, 480)">
    <rect width="240" height="230" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <!-- Header -->
    <path d="M 0 12 Q 0 0 12 0 L 228 0 Q 240 0 240 12 L 240 36 L 0 36 Z" fill="#475569" />
    <text x="14" y="24" class="table-header">cs_spk_items (Item SPK)</text>
    <!-- Columns -->
    <g transform="translate(14, 56)">
      <text x="0" y="0" class="col-name"><tspan class="col-pk">PK </tspan>id</text><text x="140" y="0" class="col-type">BIGINT</text>
      <text x="0" y="24" class="col-name"><tspan class="col-fk">FK </tspan>spk_id</text><text x="140" y="24" class="col-type">BIGINT</text>
      <text x="0" y="48" class="col-name">shoe_brand</text><text x="140" y="48" class="col-type">VARCHAR</text>
      <text x="0" y="72" class="col-name">shoe_type</text><text x="140" y="72" class="col-type">VARCHAR</text>
      <text x="0" y="96" class="col-name">services (JSON)</text><text x="140" y="96" class="col-type">LONGTEXT</text>
      <text x="0" y="120" class="col-name">item_notes</text><text x="140" y="120" class="col-type">TEXT</text>
    </g>
  </g>

  <!-- ================= ENTITAS 5: work_order_rnd_progress (TABEL BARU MANDIRI) ================= -->
  <g transform="translate(320, 460)">
    <rect width="360" height="260" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5" filter="url(#shadow)" />
    <!-- Header -->
    <path d="M 0 12 Q 0 0 12 0 L 348 0 Q 360 0 360 12 L 360 38 L 0 38 Z" fill="#4f46e5" />
    <text x="14" y="25" class="table-header">work_order_rnd_progress (Tabel Baru Mandiri)</text>
    <!-- Columns -->
    <g transform="translate(14, 58)">
      <text x="0" y="0" class="col-name"><tspan class="col-pk">PK </tspan>id</text><text x="240" y="0" class="col-type">BIGINT</text>
      <text x="0" y="22" class="col-name"><tspan class="col-fk">FK </tspan>work_order_id</text><text x="240" y="22" class="col-type">BIGINT</text>
      <text x="0" y="44" class="col-name"><tspan class="col-fk">FK </tspan>user_id (Teknisi PIC)</text><text x="240" y="44" class="col-type">BIGINT</text>
      <text x="0" y="66" class="col-name">stage_title (Tahap Riset)</text><text x="240" y="66" class="col-type">VARCHAR(255)</text>
      <text x="0" y="88" class="col-name">notes (Formula/Catatan)</text><text x="240" y="88" class="col-type">TEXT</text>
      <text x="0" y="110" class="col-name">photo_path (Foto Dokumentasi)</text><text x="240" y="110" class="col-type">VARCHAR(255)</text>
      <text x="0" y="132" class="col-name">result_status</text><text x="240" y="132" class="col-type">VARCHAR(50)</text>

      <!-- Highlighted Link & Token -->
      <rect x="-4" y="142" width="340" height="42" rx="6" fill="#ede9fe" stroke="#c7d2fe" />
      <text x="0" y="156" class="col-highlight">report_url (Link Laporan)</text><text x="240" y="156" class="col-type">VARCHAR(255)</text>
      <text x="0" y="174" class="col-highlight">report_token (Token Akses)</text><text x="240" y="174" class="col-type">VARCHAR(64)</text>
    </g>
  </g>

  <!-- ================= ENTITAS 6: work_order_logs ================= -->
  <g transform="translate(710, 480)">
    <rect width="200" height="230" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <!-- Header -->
    <path d="M 0 12 Q 0 0 12 0 L 188 0 Q 200 0 200 12 L 200 36 L 0 36 Z" fill="#334155" />
    <text x="14" y="24" class="table-header">work_order_logs</text>
    <!-- Columns -->
    <g transform="translate(14, 56)">
      <text x="0" y="0" class="col-name"><tspan class="col-pk">PK </tspan>id</text><text x="120" y="0" class="col-type">BIGINT</text>
      <text x="0" y="24" class="col-name"><tspan class="col-fk">FK </tspan>work_order_id</text><text x="120" y="24" class="col-type">BIGINT</text>
      <text x="0" y="48" class="col-name">step</text><text x="120" y="48" class="col-type">VARCHAR</text>
      <text x="0" y="72" class="col-name">action</text><text x="120" y="72" class="col-type">VARCHAR</text>
      <text x="0" y="96" class="col-name">description</text><text x="120" y="96" class="col-type">TEXT</text>
    </g>
  </g>
</svg>
