<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 720" width="950" height="720" style="background:#0f172a; font-family:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="phoneShadow2" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <linearGradient id="screenGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Title Left -->
  <g transform="translate(40, 35)">
    <text x="0" y="20" fill="#10b981" font-size="12" font-weight="800" letter-spacing="2">MOBILE PWA CONTROLLING CENTER</text>
    <text x="0" y="46" fill="#ffffff" font-size="20" font-weight="800">Dashboard Pengawasan &amp; Antrean Mobile (/m/production)</text>
    <text x="0" y="70" fill="#94a3b8" font-size="12">Monitoring SPK berjalan &amp; antrean lantai bengkel untuk Admin &amp; Teknisi lengkap dengan In-App Scanner</text>
  </g>

  <!-- SMARTPHONE MOCKUP FRAME (Center-Left) -->
  <g transform="translate(80, 105)" filter="url(#phoneShadow2)">
    <!-- Outer Phone Body -->
    <rect width="360" height="580" rx="36" fill="#1e293b" stroke="#334155" stroke-width="4"/>
    <!-- Screen Area -->
    <rect x="8" y="8" width="344" height="564" rx="28" fill="url(#screenGrad2)"/>

    <!-- Dynamic Island / Notch -->
    <rect x="132" y="16" width="96" height="20" rx="10" fill="#000000"/>
    <circle cx="212" cy="26" r="4" fill="#1e293b"/>

    <!-- Status Bar -->
    <text x="32" y="30" fill="#ffffff" font-size="10" font-weight="700">09:42</text>
    <text x="300" y="30" fill="#ffffff" font-size="10" font-weight="700">5G  🔋</text>

    <!-- App Header Inside Screen -->
    <g transform="translate(20, 48)">
      <text x="0" y="16" fill="#ffffff" font-size="13" font-weight="900">🏭 WORKSHOP CONTROLLING</text>
      <text x="0" y="30" fill="#94a3b8" font-size="9" font-weight="600">Admin Gudang • Stasiun Produksi</text>

      <rect x="235" y="4" width="68" height="26" rx="13" fill="#10b981" fill-opacity="0.15" stroke="#10b981"/>
      <text x="269" y="21" fill="#34d399" font-size="9" font-weight="800" text-anchor="middle">LIVE PWA</text>
    </g>

    <!-- Quick Filter Station Pills (Horizontal Scroll Simulation) -->
    <g transform="translate(20, 92)">
      <rect x="0" y="0" width="55" height="24" rx="6" fill="#10b981"/>
      <text x="27" y="16" fill="#ffffff" font-size="9" font-weight="800" text-anchor="middle">Semua</text>

      <rect x="62" y="0" width="55" height="24" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="89" y="16" fill="#cbd5e1" font-size="9" font-weight="700" text-anchor="middle">Soling</text>

      <rect x="124" y="0" width="55" height="24" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="151" y="16" fill="#cbd5e1" font-size="9" font-weight="700" text-anchor="middle">Upper</text>

      <rect x="186" y="0" width="60" height="24" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="216" y="16" fill="#cbd5e1" font-size="9" font-weight="700" text-anchor="middle">QC Jahit</text>

      <rect x="253" y="0" width="50" height="24" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="278" y="16" fill="#cbd5e1" font-size="9" font-weight="700" text-anchor="middle">Treat</text>
    </g>

    <!-- 3 Segmented Tabs (Sedang Berjalan, Dalam Antrean, Siap ACC) -->
    <g transform="translate(20, 126)">
      <rect width="304" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
      
      <!-- Active Tab: Sedang Berjalan -->
      <rect x="2" y="2" width="105" height="30" rx="6" fill="#0284c7"/>
      <text x="54" y="21" fill="#ffffff" font-size="9" font-weight="800" text-anchor="middle">⚡ Berjalan (2)</text>

      <!-- Tab 2: Dalam Antrean -->
      <text x="156" y="21" fill="#94a3b8" font-size="9" font-weight="700" text-anchor="middle">⏳ Antrean (5)</text>

      <!-- Tab 3: Siap ACC -->
      <text x="256" y="21" fill="#94a3b8" font-size="9" font-weight="700" text-anchor="middle">✅ Siap ACC (14)</text>
    </g>

    <!-- CARD 1: RUNNING JOB WITH LIVE TIMER & INLINE ACTION -->
    <g transform="translate(20, 172)">
      <rect width="304" height="110" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
      
      <g transform="translate(12, 12)">
        <text x="0" y="14" fill="#38bdf8" font-size="11" font-weight="900" font-family="monospace">S-2608-12-0004-SW</text>
        <rect x="180" y="0" width="100" height="20" rx="4" fill="#0284c7" fill-opacity="0.2"/>
        <text x="230" y="14" fill="#38bdf8" font-size="9" font-weight="900" text-anchor="middle">⏱ 00:41:25</text>

        <text x="0" y="32" fill="#ffffff" font-size="10" font-weight="800">Budi FastTrack • Size 42</text>
        <text x="0" y="46" fill="#94a3b8" font-size="9">Stasiun: <tspan fill="#ffffff" font-weight="700">SOLING (Reparasi Sol)</tspan> • Teknisi: <tspan fill="#ffffff" font-weight="700">Padon</tspan></text>

        <!-- Inline Action Button -->
        <rect x="0" y="58" width="280" height="30" rx="6" fill="#f43f5e"/>
        <text x="140" y="77" fill="#ffffff" font-size="10" font-weight="900" text-anchor="middle">⏹ SELESAIKAN SOLING SEKARANG</text>
      </g>
    </g>

    <!-- CARD 2: QUEUED JOB WITH INLINE START BUTTON -->
    <g transform="translate(20, 292)">
      <rect width="304" height="115" rx="12" fill="#1e293b" stroke="#334155"/>
      
      <g transform="translate(12, 12)">
        <text x="0" y="14" fill="#cbd5e1" font-size="11" font-weight="900" font-family="monospace">S-2609-15-3010-OPS</text>
        <rect x="185" y="0" width="95" height="20" rx="4" fill="#f59e0b" fill-opacity="0.15"/>
        <text x="232" y="14" fill="#fbbf24" font-size="8.5" font-weight="800" text-anchor="middle">⏳ ANTRE SOLING</text>

        <text x="0" y="32" fill="#ffffff" font-size="10" font-weight="800">Pelanggan FT Kendala 10 • Size 41</text>

        <!-- Assign Tech Dropdown -->
        <rect x="0" y="44" width="135" height="26" rx="6" fill="#0f172a" stroke="#475569"/>
        <text x="8" y="60" fill="#e2e8f0" font-size="9" font-weight="700">Teknisi: Hadi</text>

        <!-- Inline Start Button -->
        <rect x="145" y="44" width="135" height="26" rx="6" fill="#10b981"/>
        <text x="212" y="61" fill="#ffffff" font-size="10" font-weight="900" text-anchor="middle">▶ MULAI KERJA</text>
      </g>
    </g>

    <!-- CARD 3: QUEUED JOB 2 (Partial Preview) -->
    <g transform="translate(20, 417)">
      <rect width="304" height="65" rx="12" fill="#1e293b" stroke="#334155" opacity="0.6"/>
      <g transform="translate(12, 12)">
        <text x="0" y="14" fill="#cbd5e1" font-size="11" font-weight="900" font-family="monospace">S-2609-18-2022-SW</text>
        <text x="0" y="32" fill="#ffffff" font-size="10" font-weight="800">Dimas Pratama • Size 43</text>
        <text x="0" y="44" fill="#94a3b8" font-size="9">Stasiun: UPPER &amp; SOLING</text>
      </g>
    </g>

    <!-- FLOATING ACTION BUTTON: BUILT-IN QR CAMERA SCANNER -->
    <g transform="translate(255, 480)" filter="url(#phoneShadow2)">
      <circle cx="28" cy="28" r="26" fill="#10b981" stroke="#ffffff" stroke-width="2.5"/>
      <text x="28" y="34" fill="#ffffff" font-size="20" text-anchor="middle">📷</text>
    </g>

    <!-- Bottom Navigation Bar PWA -->
    <g transform="translate(20, 520)">
      <rect width="304" height="38" rx="10" fill="#0f172a" stroke="#334155"/>
      <text x="45" y="24" fill="#10b981" font-size="10" font-weight="800">⚡ Antrean</text>
      <text x="152" y="24" fill="#94a3b8" font-size="10" font-weight="700">🔍 Cari SPK</text>
      <text x="255" y="24" fill="#94a3b8" font-size="10" font-weight="700">👤 Akun</text>
    </g>
  </g>

  <!-- CALLOUT LABELS ON THE RIGHT -->
  <g transform="translate(480, 125)">
    <!-- Feature 1: Dual Role View -->
    <g transform="translate(0, 0)">
      <rect width="400" height="90" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text x="16" y="24" fill="#34d399" font-size="12" font-weight="800">1. DUAL MODE: ADMIN &amp; TEKNISI VIEW</text>
      <text x="16" y="44" fill="#cbd5e1" font-size="11">• <tspan font-weight="800" fill="#ffffff">Admin / SPV:</tspan> Melihat seluruh antrean lantai bengkel secara real-time</text>
      <text x="16" y="60" fill="#cbd5e1" font-size="11">  sambil keliling meja kerja tanpa harus di depan PC.</text>
      <text x="16" y="76" fill="#cbd5e1" font-size="11">• <tspan font-weight="800" fill="#ffffff">Teknisi:</tspan> Filter "Tugas Saya" untuk melihat sepatu antrean berikutnya.</text>
    </g>

    <!-- Feature 2: 3 Smart Segmented Tabs -->
    <g transform="translate(0, 105)">
      <rect width="400" height="85" rx="10" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
      <text x="16" y="24" fill="#38bdf8" font-size="12" font-weight="800">2. 3 TAB PINTAR PENGENDALI STATUS</text>
      <text x="16" y="44" fill="#cbd5e1" font-size="11">• <tspan font-weight="800" fill="#ffffff">Sedang Berjalan:</tspan> Menampilkan pengerjaan aktif + live stopwatch.</text>
      <text x="16" y="60" fill="#cbd5e1" font-size="11">• <tspan font-weight="800" fill="#ffffff">Dalam Antrean:</tspan> Sepatu siap dikerjakan di stasiun terkait.</text>
      <text x="16" y="76" fill="#cbd5e1" font-size="11">• <tspan font-weight="800" fill="#ffffff">Siap ACC:</tspan> Menampilkan hasil kerja yang menunggu approval.</text>
    </g>

    <!-- Feature 3: Full Inline Quick Action -->
    <g transform="translate(0, 205)">
      <rect width="400" height="95" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="16" y="24" fill="#fbbf24" font-size="12" font-weight="800">3. FULL INLINE ACTION DI SETIAP KARTU</text>
      <text x="16" y="44" fill="#cbd5e1" font-size="11">Admin/Teknisi bisa langsung <tspan font-weight="800" fill="#ffffff">memilih teknisi</tspan> dan menekan tombol</text>
      <text x="16" y="60" fill="#cbd5e1" font-size="11"><tspan font-weight="800" fill="#ffffff">[Mulai]</tspan> atau <tspan font-weight="800" fill="#ffffff">[Selesai]</tspan> langsung dari kartu antrean</text>
      <text x="16" y="76" fill="#cbd5e1" font-size="11">tanpa harus masuk ke halaman detail jika sedang buru-buru!</text>
    </g>

    <!-- Feature 4: Floating Camera Scanner Button -->
    <g transform="translate(0, 315)">
      <rect width="400" height="95" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="16" y="24" fill="#fb7185" font-size="12" font-weight="800">4. BUILT-IN PWA CAMERA SCANNER (TOMBOL MELAYANG)</text>
      <text x="16" y="44" fill="#cbd5e1" font-size="11">Tombol mengambang <tspan font-weight="800" fill="#ffffff">[📷 Scan SPK]</tspan> di pojok kanan bawah HP:</text>
      <text x="16" y="60" fill="#cbd5e1" font-size="11">Sekali tap, kamera langsung aktif memindai QR fisik SPK di meja</text>
      <text x="16" y="76" fill="#cbd5e1" font-size="11">dan otomatis melompat ke kartu SPK tersebut!</text>
    </g>
  </g>
</svg>
