<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" style="background:#0f172a; font-family:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gradIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="gradRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="gradCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Canvas Header -->
  <rect x="0" y="0" width="1000" height="75" fill="#1e293b" opacity="0.8"/>
  <text x="40" y="36" fill="#10b981" font-size="12" font-weight="800" letter-spacing="2">SHOE WORKSHOP • ARSITEKTUR KONTROL OPERASIONAL LANTAI BENGKEL</text>
  <text x="40" y="58" fill="#ffffff" font-size="18" font-weight="800">Alur End-to-End: Scan QR SPK Fisik ➔ Mobile Controller ➔ Real-Time Sync Dashboard</text>
  <rect x="830" y="24" width="130" height="28" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
  <text x="895" y="42" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">0 DB MIGRATION</text>

  <!-- Step 1: Print SPK Fisik -->
  <g transform="translate(40, 110)" filter="url(#shadow)">
    <rect width="265" height="150" rx="12" fill="url(#gradCard)" stroke="#334155" stroke-width="1.5"/>
    <rect width="265" height="34" rx="12" fill="#22b086" fill-opacity="0.15"/>
    <rect x="12" y="10" width="14" height="14" rx="3" fill="#10b981"/>
    <text x="19" y="21" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">1</text>
    <text x="34" y="22" fill="#34d399" font-size="12" font-weight="800">LEMBAR CETAK SPK FISIK</text>
    
    <text x="16" y="58" fill="#e2e8f0" font-size="13" font-weight="700">QR Code Tertanam di Sidebar</text>
    <text x="16" y="78" fill="#94a3b8" font-size="11" line-height="1.4">Tercetak pada lembar fisik SPK</text>
    <text x="16" y="95" fill="#94a3b8" font-size="11">Memuat URL unik:</text>
    <rect x="16" y="105" width="233" height="28" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="24" y="123" fill="#38bdf8" font-size="10" font-family="monospace">/m/spk/S-2608-12-0004-SW</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M305 185 L355 185" stroke="#10b981" stroke-width="2.5" stroke-dasharray="5,5"/>
  <polygon points="360,185 352,180 352,190" fill="#10b981"/>
  <text x="332" y="176" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">Scan HP</text>

  <!-- Step 2: Kamera & Mobile Web -->
  <g transform="translate(365, 110)" filter="url(#shadow)">
    <rect width="270" height="150" rx="12" fill="url(#gradCard)" stroke="#4f46e5" stroke-width="1.5"/>
    <rect width="270" height="34" rx="12" fill="#4f46e5" fill-opacity="0.15"/>
    <rect x="12" y="10" width="14" height="14" rx="3" fill="#6366f1"/>
    <text x="19" y="21" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">2</text>
    <text x="34" y="22" fill="#818cf8" font-size="12" font-weight="800">MOBILE APP CONTROLLER</text>
    
    <text x="16" y="58" fill="#e2e8f0" font-size="13" font-weight="700">Akses Instan Tanpa Login</text>
    <text x="16" y="78" fill="#94a3b8" font-size="11">Halaman mobile terbuka di browser HP</text>
    <text x="16" y="95" fill="#94a3b8" font-size="11">Tampil rincian: Sepatu, Size & Jasa</text>
    <rect x="16" y="105" width="238" height="28" rx="6" fill="#4f46e5" fill-opacity="0.1" stroke="#6366f1"/>
    <text x="24" y="123" fill="#a5b4fc" font-size="10" font-weight="700">📱 Livewire Mobile Component</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M635 185 L685 185" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="5,5"/>
  <polygon points="690,185 682,180 682,190" fill="#6366f1"/>
  <text x="662" y="176" fill="#818cf8" font-size="10" font-weight="700" text-anchor="middle">Tap Mulai</text>

  <!-- Step 3: Tombol Aksi & Timer -->
  <g transform="translate(695, 110)" filter="url(#shadow)">
    <rect width="265" height="150" rx="12" fill="url(#gradCard)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="265" height="34" rx="12" fill="#f59e0b" fill-opacity="0.15"/>
    <rect x="12" y="10" width="14" height="14" rx="3" fill="#f59e0b"/>
    <text x="19" y="21" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">3</text>
    <text x="34" y="22" fill="#fbbf24" font-size="12" font-weight="800">KONTROL KERJA & STOPWATCH</text>
    
    <text x="16" y="58" fill="#e2e8f0" font-size="13" font-weight="700">Pilih Stasiun & Nama Teknisi</text>
    <text x="16" y="78" fill="#94a3b8" font-size="11">Pilih Stasiun: Soling / Upper / QC</text>
    <rect x="16" y="92" width="110" height="42" rx="6" fill="#10b981"/>
    <text x="71" y="117" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">▶ MULAI KERJA</text>
    <rect x="134" y="92" width="115" height="42" rx="6" fill="#f43f5e"/>
    <text x="191" y="117" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">⏹ SELESAI</text>
  </g>

  <!-- Connecting down from Step 3 to Step 4 -->
  <path d="M827 260 L827 340 L500 340 L500 395" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5,5" fill="none"/>
  <polygon points="500,400 495,392 505,392" fill="#f59e0b"/>
  <text x="663" y="330" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">Tersimpan ke Database Tanpa Migration</text>

  <!-- Step 4: Database Layer (No New Table) -->
  <g transform="translate(180, 400)" filter="url(#shadow)">
    <rect width="640" height="110" rx="12" fill="url(#gradCard)" stroke="#38bdf8" stroke-width="2"/>
    <rect width="640" height="34" rx="12" fill="#38bdf8" fill-opacity="0.15"/>
    <rect x="14" y="10" width="14" height="14" rx="3" fill="#0284c7"/>
    <text x="21" y="21" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">4</text>
    <text x="36" y="22" fill="#38bdf8" font-size="12" font-weight="800">DATABASE WORKSHOP (KOLOM EKSISTING DI WORK_ORDERS)</text>
    
    <g transform="translate(20, 46)">
      <rect width="180" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="10" y="20" fill="#94a3b8" font-size="9" font-weight="700">WAKTU MULAI & TEKNISI</text>
      <text x="10" y="38" fill="#38bdf8" font-size="11" font-family="monospace">prod_sol_started_at</text>
    </g>
    <g transform="translate(215, 46)">
      <rect width="180" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="10" y="20" fill="#94a3b8" font-size="9" font-weight="700">WAKTU SELESAI</text>
      <text x="10" y="38" fill="#34d399" font-size="11" font-family="monospace">prod_sol_completed_at</text>
    </g>
    <g transform="translate(410, 46)">
      <rect width="210" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="10" y="20" fill="#94a3b8" font-size="9" font-weight="700">AUDIT LOG REALTIME</text>
      <text x="10" y="38" fill="#fbbf24" font-size="11" font-family="monospace">work_order_logs (Action)</text>
    </g>
  </g>

  <!-- Arrow Step 4 down to Step 5 -->
  <path d="M500 510 L500 555" stroke="#38bdf8" stroke-width="2.5"/>
  <polygon points="500,560 495,552 505,552" fill="#38bdf8"/>
  <text x="500" y="538" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">Auto-Sync Dashboard</text>

  <!-- Step 5: Desktop Production Dashboard -->
  <g transform="translate(40, 560)" filter="url(#shadow)">
    <rect width="920" height="100" rx="12" fill="url(#gradCard)" stroke="#10b981" stroke-width="1.5"/>
    <rect width="920" height="30" rx="12" fill="#10b981" fill-opacity="0.15"/>
    <rect x="14" y="8" width="14" height="14" rx="3" fill="#10b981"/>
    <text x="21" y="19" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">5</text>
    <text x="36" y="20" fill="#34d399" font-size="11" font-weight="800">DASHBOARD PRODUKSI DESKTOP (/production) — SINKRON OTOMATIS TANPA RELOAD</text>
    
    <g transform="translate(20, 42)">
      <text x="0" y="20" fill="#e2e8f0" font-size="12" font-weight="700">SPK S-2608-12-0004-SW</text>
      <text x="0" y="38" fill="#94a3b8" font-size="10">Budi FastTrack • Nike Pegasus</text>
      
      <!-- Badges -->
      <g transform="translate(220, 5)">
        <rect width="180" height="34" rx="6" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7"/>
        <text x="90" y="21" fill="#38bdf8" font-size="10" font-weight="800" text-anchor="middle">SOLING: SEDANG BERJALAN</text>
      </g>
      <g transform="translate(415, 5)">
        <rect width="180" height="34" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981"/>
        <text x="90" y="21" fill="#34d399" font-size="10" font-weight="800" text-anchor="middle">SOLING: SELESAI (PADON)</text>
      </g>
      <g transform="translate(610, 5)">
        <rect width="270" height="34" rx="6" fill="#1e293b" stroke="#334155"/>
        <text x="135" y="21" fill="#fbbf24" font-size="10" font-weight="800" text-anchor="middle">⏱ DURASI KERJA AKTUAL: 42 MENIT</text>
      </g>
    </g>
  </g>
</svg>
