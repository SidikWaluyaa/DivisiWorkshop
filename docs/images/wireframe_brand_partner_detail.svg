<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      .title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11.5px; font-weight: 500; fill: #64748b; }
      .lbl { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10px; font-weight: 700; fill: #64748b; text-transform: uppercase; letter-spacing: 0.05em; }
      .val { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
      .th { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10px; font-weight: 700; fill: #475569; text-transform: uppercase; }
      .td { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; font-weight: 600; fill: #1e293b; }
      .mono { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 700; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Browser Frame Window -->
  <rect width="960" height="760" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Browser Header Bar -->
  <path d="M 0 16 Q 0 0 16 0 L 944 0 Q 960 0 960 16 L 960 42 L 0 42 Z" fill="#0f172a"/>
  <circle cx="24" cy="21" r="5.5" fill="#ef4444"/>
  <circle cx="42" cy="21" r="5.5" fill="#f59e0b"/>
  <circle cx="60" cy="21" r="5.5" fill="#10b981"/>
  <rect x="180" y="10" width="600" height="22" rx="6" fill="#1e293b"/>
  <text x="350" y="25" font-family="'JetBrains Mono', monospace" font-size="10.5px" fill="#94a3b8">https://workshop.internal/workshop/brands/14</text>

  <!-- Main Container -->
  <g transform="translate(30, 60)">
    <!-- Back button & Breadcrumb -->
    <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5px" font-weight="700" fill="#b45309">
      ← Kembali ke Daftar Mitra Brand
    </text>

    <!-- 1. PARTNER PROFILE HERO CARD -->
    <g transform="translate(0, 30)">
      <rect width="900" height="155" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
      <path d="M 0 12 Q 0 0 12 0 L 16 0 L 16 155 L 12 155 Q 0 155 0 143 Z" fill="#d97706"/>

      <!-- Brand Logo / Avatar -->
      <g transform="translate(35, 25)">
        <rect width="80" height="80" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
        <text x="22" y="52" font-size="36">🏷️</text>
      </g>

      <!-- Brand Identity Details -->
      <g transform="translate(135, 25)">
        <text x="0" y="22" class="title" style="font-size: 20px;">PT VENTELA SEPATU INDONESIA</text>
        
        <rect x="0" y="32" width="85" height="18" rx="4" fill="#fef3c7"/>
        <text x="8" y="45" font-family="'JetBrains Mono', monospace" font-size="9.5px" font-weight="700" fill="#b45309">BRD-VNTL</text>

        <rect x="95" y="32" width="115" height="18" rx="4" fill="#dcfce7"/>
        <text x="103" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5px" font-weight="700" fill="#15803d">STATUS: ACTIVE</text>

        <rect x="218" y="32" width="110" height="18" rx="4" fill="#e0f2fe"/>
        <text x="226" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5px" font-weight="700" fill="#0369a1">TIER: EXCLUSIVE B2B</text>

        <!-- Metadata row -->
        <g transform="translate(0, 72)">
          <text x="0" y="0" class="lbl">PIC LAPANGAN:</text>
          <text x="0" y="16" class="val">Bpk. Budi Santoso (Production Head)</text>

          <text x="240" y="0" class="lbl">WHATSAPP / TELEPON:</text>
          <text x="240" y="16" class="val" fill="#0284c7">0812-3456-7890</text>

          <text x="440" y="0" class="lbl">ALAMAT PABRIK / GUDANG:</text>
          <text x="440" y="16" class="val">Kawasan Industri Dayeuhkolot No. 88, Bandung</text>
        </g>
      </g>

      <!-- Action Button on Right: New Batch for this Brand -->
      <g transform="translate(710, 25)">
        <rect width="165" height="38" rx="8" fill="#d97706"/>
        <text x="18" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5px" font-weight="700" fill="#ffffff">
          + Buat Batch Baru
        </text>

        <!-- Edit Partner -->
        <rect y="48" width="165" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="35" y="69" font-family="'Plus Jakarta Sans', sans-serif" font-size="11px" font-weight="600" fill="#475569">
          ✏️ Edit Profil Mitra
        </text>
      </g>
    </g>

    <!-- 2. LIFETIME METRIC CARDS FOR THIS BRAND -->
    <g transform="translate(0, 205)">
      <!-- Card 1: Total Batch -->
      <rect width="210" height="70" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="16" y="24" class="lbl">TOTAL BATCH DITERIMA</text>
      <text x="16" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="20px" font-weight="800" fill="#d97706">8 <tspan font-size="11px" font-weight="600" fill="#64748b">Batch Order</tspan></text>

      <!-- Card 2: Total Pasang Lifetime -->
      <g transform="translate(230, 0)">
        <rect width="210" height="70" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
        <text x="16" y="24" class="lbl">TOTAL SEPATU DIKERJAKAN</text>
        <text x="16" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="20px" font-weight="800" fill="#0f172a">450 <tspan font-size="11px" font-weight="600" fill="#64748b">Pasang</tspan></text>
      </g>

      <!-- Card 3: Batch Aktif Saat Ini -->
      <g transform="translate(460, 0)">
        <rect width="210" height="70" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
        <text x="16" y="24" class="lbl">SEDANG PROSES DI BENGKEL</text>
        <text x="16" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="20px" font-weight="800" fill="#ea580c">2 Batch <tspan font-size="11px" font-weight="600" fill="#64748b">(80 psg)</tspan></text>
      </g>

      <!-- Card 4: Selesai & Dispatched -->
      <g transform="translate(690, 0)">
        <rect width="210" height="70" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
        <text x="16" y="24" class="lbl">BATCH SELESAI / DISPATCH</text>
        <text x="16" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="20px" font-weight="800" fill="#16a34a">6 <tspan font-size="11px" font-weight="600" fill="#64748b">Batch Lolos QC</tspan></text>
      </g>
    </g>

    <!-- 3. TABEL RIWAYAT PESANAN (ORDER HISTORY LIST) -->
    <g transform="translate(0, 295)">
      <rect width="900" height="375" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>

      <!-- Section Title -->
      <g transform="translate(20, 20)">
        <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="14px" font-weight="800" fill="#0f172a">
          📦 Riwayat Seluruh Batch Pesanan dari Ventela Indonesia
        </text>
        <text x="0" y="34" class="subtitle">
          Klik salah satu batch untuk melihat rincian progres per pasang sepatu dan stasiun kerjanya
        </text>
      </g>

      <!-- Table Header -->
      <g transform="translate(20, 65)">
        <rect width="860" height="30" rx="4" fill="#f8fafc"/>
        <text x="14" y="20" class="th">NO BATCH SPK</text>
        <text x="150" y="20" class="th">NAMA PROYEK &amp; NO PO</text>
        <text x="350" y="20" class="th">TANGGAL MASUK</text>
        <text x="470" y="20" class="th">TOTAL PASANG</text>
        <text x="580" y="20" class="th">PROGRESS BENGKEL</text>
        <text x="730" y="20" class="th">STATUS BATCH</text>
        <text x="815" y="20" class="th">AKSI</text>
      </g>

      <!-- Row 1: Active Inbound Batch -->
      <g transform="translate(20, 105)">
        <rect width="860" height="56" rx="6" fill="#fffbeb" stroke="#fde68a"/>
        <text x="14" y="26" class="mono" fill="#d97706">BR-2609-30-0001</text>
        <text x="14" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5px" fill="#b45309">Batch Terbaru</text>

        <text x="150" y="25" class="td">Recrafting Sol Batch Oktober</text>
        <text x="150" y="42" class="mono" style="font-size: 9px; fill: #0284c7;">PO: VNTL-PO-8821</text>

        <text x="350" y="32" class="td">30 Sep 2026</text>

        <text x="470" y="32" class="td" style="font-weight: 800;">50 Pasang</text>

        <!-- Progress Bar (35/50 = 70%) -->
        <g transform="translate(580, 18)">
          <rect width="110" height="10" rx="5" fill="#e2e8f0"/>
          <rect width="77" height="10" rx="5" fill="#d97706"/>
          <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="9px" font-weight="700" fill="#b45309">35/50 (70%) - Prod</text>
        </g>

        <rect x="730" y="18" width="75" height="20" rx="4" fill="#fef3c7"/>
        <text x="736" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5px" font-weight="700" fill="#b45309">IN PROD</text>

        <rect x="815" y="16" width="35" height="24" rx="4" fill="#d97706"/>
        <text x="822" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5px" font-weight="700" fill="#ffffff">Buka</text>
      </g>

      <!-- Row 2: Second Active Batch -->
      <g transform="translate(20, 170)">
        <rect width="860" height="56" rx="6" fill="#ffffff" stroke="#f1f5f9"/>
        <text x="14" y="26" class="mono" fill="#d97706">BR-2609-20-0002</text>
        <text x="150" y="25" class="td">Public High Sole Reglue Sample</text>
        <text x="150" y="42" class="mono" style="font-size: 9px; fill: #0284c7;">PO: VNTL-SMPL-04</text>

        <text x="350" y="32" class="td">20 Sep 2026</text>
        <text x="470" y="32" class="td" style="font-weight: 800;">30 Pasang</text>

        <!-- Progress Bar (28/30 = 93%) -->
        <g transform="translate(580, 18)">
          <rect width="110" height="10" rx="5" fill="#e2e8f0"/>
          <rect width="102" height="10" rx="5" fill="#0284c7"/>
          <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="9px" font-weight="700" fill="#0284c7">28/30 (93%) - QC</text>
        </g>

        <rect x="730" y="18" width="75" height="20" rx="4" fill="#e0f2fe"/>
        <text x="742" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5px" font-weight="700" fill="#0369a1">FINAL QC</text>

        <rect x="815" y="16" width="35" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
        <text x="822" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5px" font-weight="700" fill="#475569">Buka</text>
      </g>

      <!-- Row 3: Finished Batch Past -->
      <g transform="translate(20, 235)">
        <rect width="860" height="56" rx="6" fill="#ffffff" stroke="#f1f5f9"/>
        <text x="14" y="26" class="mono" fill="#d97706">BR-2608-15-0004</text>
        <text x="150" y="25" class="td">Sole Stitching Rework Massal</text>
        <text x="150" y="42" class="mono" style="font-size: 9px; fill: #0284c7;">PO: VNTL-PO-8102</text>

        <text x="350" y="32" class="td">15 Agu 2026</text>
        <text x="470" y="32" class="td" style="font-weight: 800;">100 Pasang</text>

        <!-- Progress Bar (100%) -->
        <g transform="translate(580, 18)">
          <rect width="110" height="10" rx="5" fill="#e2e8f0"/>
          <rect width="110" height="10" rx="5" fill="#16a34a"/>
          <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="9px" font-weight="700" fill="#15803d">100/100 (100%)</text>
        </g>

        <rect x="730" y="18" width="75" height="20" rx="4" fill="#dcfce7"/>
        <text x="738" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5px" font-weight="700" fill="#15803d">FINISHED</text>

        <rect x="815" y="16" width="35" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
        <text x="822" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5px" font-weight="700" fill="#475569">Buka</text>
      </g>
    </g>
  </g>
</svg>
