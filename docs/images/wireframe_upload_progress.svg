<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 880" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      .title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px; font-weight: 500; fill: #64748b; }
      .modal-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 800; fill: #0f172a; }
      .form-label { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; fill: #475569; }
      .input-text { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11.5px; fill: #0f172a; font-weight: 600; }
      .input-sub { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10px; fill: #94a3b8; }
      .badge-txt { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 700; }
    </style>
    <filter id="modal-shadow" x="-8%" y="-8%" width="116%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="940" height="880" rx="20" fill="#f8fafc" />
  <rect x="1" y="1" width="938" height="878" rx="19" fill="none" stroke="#e2e8f0" stroke-width="2" />

  <!-- Top Title Banner -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="44" height="44" rx="12" fill="#ede9fe" />
    <text x="12" y="30" font-size="22">🖥️</text>
    <text x="60" y="22" class="title">Wireframe: Antarmuka Internal &amp; Modal Upload Progres</text>
    <text x="60" y="40" class="subtitle">Detail Order (/admin/orders/{id}) • Card Jurnal R&amp;D &amp; Dialog Popup Form Teknisi</text>
  </g>

  <!-- BACKDROP (Simulating Darkened Background) -->
  <g transform="translate(40, 95)">
    <!-- Base Page Preview (Card on Order Detail Page) -->
    <rect width="860" height="745" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
    
    <!-- Order Header Bar Preview -->
    <g transform="translate(25, 20)">
      <rect width="810" height="60" rx="10" fill="#ffffff" stroke="#e2e8f0" />
      <text x="20" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="14px" font-weight="800" fill="#0f172a">Detail SPK #RD-2609-29-0001-CS1</text>
      <rect x="310" y="20" width="80" height="24" rx="6" fill="#4f46e5" />
      <text x="320" y="36" class="badge-txt" fill="#ffffff">SPK R&amp;D</text>
      
      <!-- Right Quick Buttons -->
      <rect x="520" y="18" width="130" height="28" rx="6" fill="#ede9fe" stroke="#c7d2fe" />
      <text x="532" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5px" font-weight="700" fill="#4338ca">🔗 Salin Link Laporan</text>

      <rect x="660" y="18" width="135" height="28" rx="6" fill="#4f46e5" />
      <text x="672" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5px" font-weight="700" fill="#ffffff">🌐 Buka Web Laporan</text>
    </g>

    <!-- Dark Overlay Backdrop for Modal -->
    <rect y="100" width="860" height="645" rx="14" fill="#0f172a" fill-opacity="0.65" />

    <!-- ================= THE MODAL POPUP DIALOG ================= -->
    <g transform="translate(130, 115)" filter="url(#modal-shadow)">
      <rect width="600" height="610" rx="18" fill="#ffffff" />

      <!-- Modal Header -->
      <g>
        <path d="M 0 18 Q 0 0 18 0 L 582 0 Q 600 0 600 18 L 600 58 L 0 58 Z" fill="#1e1b4b" />
        <rect x="18" y="14" width="30" height="30" rx="8" fill="#ffffff" fill-opacity="0.15" />
        <text x="24" y="35" font-size="16">📸</text>
        <text x="58" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="14px" font-weight="800" fill="#ffffff">Tambah Progres Riset &amp; Dokumentasi R&amp;D</text>
        <text x="58" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-size="10px" font-weight="500" fill="#c7d2fe">Data &amp; foto akan otomatis ter-update pada link laporan publik.</text>
        
        <!-- Close Button (X) -->
        <circle cx="570" cy="29" r="12" fill="#ffffff" fill-opacity="0.1" />
        <text x="565" y="34" font-size="14" fill="#ffffff" font-weight="700">✕</text>
      </g>

      <!-- Modal Form Body -->
      <g transform="translate(30, 75)">
        
        <!-- Field 1: Judul / Tahap Progres -->
        <g>
          <text x="0" y="12" class="form-label">Judul / Tahap Eksperimen <tspan fill="#ef4444">*</tspan></text>
          <rect y="22" width="540" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
          <text x="14" y="46" class="input-text">Aplikasi Formula Cat FlexiLeather V2 (Lapisan Ke-2)</text>
        </g>

        <!-- Field 2: Status Hasil Uji -->
        <g transform="translate(0, 75)">
          <text x="0" y="12" class="form-label">Status Hasil Uji Tahap Ini <tspan fill="#ef4444">*</tspan></text>
          
          <!-- Radio Option 1: Sedang Uji -->
          <g transform="translate(0, 22)">
            <rect width="125" height="32" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
            <circle cx="18" cy="16" r="6" fill="#ffffff" stroke="#2563eb" stroke-width="4" />
            <text x="32" y="20" class="badge-txt" fill="#1e40af">IN PROGRESS</text>
          </g>

          <!-- Radio Option 2: Lolos / Berhasil -->
          <g transform="translate(135, 22)">
            <rect width="125" height="32" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" />
            <circle cx="18" cy="16" r="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
            <text x="32" y="20" class="badge-txt" fill="#065f46">BERHASIL / LOLOS</text>
          </g>

          <!-- Radio Option 3: Perlu Revisi -->
          <g transform="translate(270, 22)">
            <rect width="130" height="32" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5" />
            <circle cx="18" cy="16" r="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
            <text x="32" y="20" class="badge-txt" fill="#92400e">PERLU REVISI</text>
          </g>

          <!-- Radio Option 4: Gagal -->
          <g transform="translate(410, 22)">
            <rect width="130" height="32" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" />
            <circle cx="18" cy="16" r="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
            <text x="32" y="20" class="badge-txt" fill="#991b1b">GAGAL TRIAL</text>
          </g>
        </g>

        <!-- Field 3: Upload Foto Dokumentasi -->
        <g transform="translate(0, 145)">
          <text x="0" y="12" class="form-label">Foto Dokumentasi Fisik <tspan fill="#ef4444">*</tspan></text>
          <rect y="22" width="540" height="85" rx="10" fill="#f8fafc" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="5,5" />
          <text x="250" y="55" font-size="22">📷</text>
          <text x="165" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="11px" font-weight="700" fill="#4338ca">Klik untuk ambil foto / seret file ke sini</text>
          <text x="185" y="90" class="input-sub">Format: JPG, PNG, WEBP • Resolusi Maksimal 10MB</text>
        </g>

        <!-- Field 4: Catatan Formula & Observasi Teknis -->
        <g transform="translate(0, 260)">
          <text x="0" y="12" class="form-label">Catatan Formula &amp; Parameter Pengujian (Notes)</text>
          <rect y="22" width="540" height="95" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
          <text x="14" y="42" class="input-text">Komposisi: 70% Polyurethane Binder + 30% Pigment Concentrate.</text>
          <text x="14" y="60" class="input-text">Waktu pengeringan: 4 jam suhu 32°C. Daya rekat sangat tinggi pada</text>
          <text x="14" y="78" class="input-text">permukaan kulit nubuck. Hasil lentur dan tidak pecah.</text>
        </g>

        <!-- Field 5: Link Lampiran Pendukung Opsional -->
        <g transform="translate(0, 390)">
          <text x="0" y="12" class="form-label">Link Dokumen / Video Lab Pendukung (Opsional)</text>
          <rect y="22" width="540" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
          <text x="14" y="46" font-family="'JetBrains Mono', monospace" font-size="10.5px" fill="#2563eb">https://drive.google.com/file/d/video-pengujian-flex-test.mp4</text>
        </g>

        <!-- Action Buttons Footer -->
        <g transform="translate(0, 475)">
          <line x1="0" y1="0" x2="540" y2="0" stroke="#e2e8f0" stroke-width="1" />
          
          <rect x="290" y="14" width="100" height="38" rx="10" fill="#f1f5f9" stroke="#cbd5e1" />
          <text x="325" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5px" font-weight="700" fill="#475569">Batal</text>

          <rect x="405" y="14" width="135" height="38" rx="10" fill="#4f46e5" />
          <text x="422" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5px" font-weight="800" fill="#ffffff">💾 Simpan Progres</text>
        </g>

      </g>
    </g>
  </g>
</svg>
