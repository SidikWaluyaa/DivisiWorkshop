<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .modal-bg { fill: #ffffff; rx: 24; filter: drop-shadow(0 25px 50px -12px rgba(0,0,0,0.4)); }
      .header-bg { fill: #f8fafc; rx: 24; }
      .footer-bg { fill: #ffffff; stroke-top: #f1f5f9; }
      .panel-left { fill: #ffffff; }
      .panel-right { fill: #f8fafc; stroke: #e2e8f0; rx: 16; }
      .card-item { fill: #ffffff; stroke: #e2e8f0; rx: 16; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.02)); }
      .input-box { fill: #f8fafc; stroke: #e2e8f0; rx: 10; }
      .toggle-box { fill: #ecfdf5; stroke: #22af85; rx: 14; }
      .btn-submit { fill: #22af85; rx: 14; filter: drop-shadow(0 10px 15px rgba(34,176,134,0.3)); }
      .text-title { font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 900; fill: #0f172a; letter-spacing: -0.02em; }
      .text-sub { font-family: 'Inter', -apple-system, sans-serif; font-size: 11px; fill: #64748b; font-weight: 500; }
      .text-label { font-family: 'Inter', -apple-system, sans-serif; font-size: 9px; font-weight: 800; fill: #64748b; text-transform: uppercase; letter-spacing: 0.1em; }
      .text-value { font-family: 'Inter', -apple-system, sans-serif; font-size: 12px; font-weight: 800; fill: #0f172a; }
      .badge-tag { fill: #dbeafe; rx: 6; }
      .badge-text { font-family: 'Inter', -apple-system, sans-serif; font-size: 9px; font-weight: 800; fill: #1e40af; }
    </style>
  </defs>

  <!-- Dark Overlay -->
  <rect width="1000" height="600" fill="#0f172a" opacity="0.85"/>

  <!-- Modal Container -->
  <g transform="translate(40, 30)">
    <rect width="920" height="540" class="modal-bg"/>

    <!-- Modal Header -->
    <rect width="920" height="70" class="header-bg"/>
    <rect y="46" width="920" height="24" fill="#f8fafc"/>
    <line x1="0" y1="70" x2="920" y2="70" stroke="#f1f5f9" stroke-width="1.5"/>
    <text x="30" y="38" class="text-title">FINALISASI SPK &amp; SERAH TERIMA WORKSHOP</text>
    <text x="30" y="55" class="text-sub">Konfirmasi informasi pengiriman, pembayaran DP, dan serah terima lini workshop dalam 1 langkah.</text>

    <!-- Preview SPK Badge -->
    <g transform="translate(680, 16)">
      <rect width="160" height="38" fill="#0f172a" rx="12"/>
      <text x="14" y="16" font-family="'Inter', sans-serif" font-size="8px" font-weight="900" fill="#34d399" letter-spacing="0.1em">PRATINJAU NOMOR SPK</text>
      <text x="14" y="30" font-family="'Outfit', sans-serif" font-size="13px" font-weight="900" fill="#ffffff">S-OF2610-001</text>
    </g>

    <!-- Close Button -->
    <circle cx="885" cy="35" r="15" fill="#f1f5f9"/>
    <text x="880" y="40" font-family="sans-serif" font-size="14px" font-weight="bold" fill="#64748b">✕</text>

    <!-- Modal Body: 2 Columns -->
    <!-- LEFT COLUMN: Shipping & Payment -->
    <g transform="translate(30, 85)">
      <text x="0" y="15" class="text-label" fill="#065f46">📋 INFORMASI PENGIRIMAN &amp; PEMBAYARAN</text>

      <!-- Delivery Method -->
      <g transform="translate(0, 26)">
        <text x="0" y="10" class="text-label">METODE PENGIRIMAN</text>
        <rect y="16" width="195" height="36" class="input-box"/>
        <text x="12" y="39" class="text-value">Offline (Ambil Sendiri) ▼</text>
      </g>

      <!-- CS Code Auto-filled -->
      <g transform="translate(210, 26)">
        <text x="0" y="10" class="text-label">KODE CS (MANUAL/AUTO)</text>
        <rect y="16" width="195" height="36" class="input-box" stroke="#22af85"/>
        <text x="12" y="39" class="text-value" fill="#065f46">FR  <tspan font-size="9px" font-weight="normal" fill="#10b981">✓ Auto dari Akun</tspan></text>
      </g>

      <!-- SMART HANDOVER TOGGLE BOX -->
      <g transform="translate(0, 90)">
        <rect width="405" height="52" class="toggle-box"/>
        <!-- Switch Graphic -->
        <rect x="14" y="14" width="44" height="24" rx="12" fill="#22af85"/>
        <circle cx="46" cy="26" r="9" fill="#ffffff"/>
        <text x="70" y="27" font-family="'Inter', sans-serif" font-size="11px" font-weight="900" fill="#065f46">Langsung Serahkan ke Workshop Sekarang</text>
        <text x="70" y="41" font-family="'Inter', sans-serif" font-size="9px" font-weight="600" fill="#047857">Barang fisik sudah di workshop (1-Klik proses tanpa buka modal kedua)</text>
      </g>

      <!-- Payment Logic Box -->
      <g transform="translate(0, 155)">
        <rect width="405" height="150" fill="#22af85" rx="16"/>
        <text x="18" y="24" font-family="'Inter', sans-serif" font-size="10px" font-weight="900" fill="#ffffff" letter-spacing="0.1em">LOGIKA PEMBAYARAN &amp; DP</text>

        <!-- Payment Type -->
        <rect x="18" y="36" width="175" height="34" fill="#ffffff" opacity="0.2" rx="10"/>
        <text x="28" y="57" font-family="'Inter', sans-serif" font-size="10.5px" font-weight="800" fill="#ffffff">Uang Muka (DP) ▼</text>

        <!-- Payment Method -->
        <rect x="205" y="36" width="180" height="34" fill="#ffffff" opacity="0.2" rx="10"/>
        <text x="215" y="57" font-family="'Inter', sans-serif" font-size="10.5px" font-weight="800" fill="#ffffff">Transfer Bank ▼</text>

        <!-- DP Amount Box -->
        <rect x="18" y="80" width="370" height="36" fill="#ffffff" rx="10"/>
        <text x="28" y="103" font-family="'Inter', sans-serif" font-size="10px" font-weight="800" fill="#64748b">NOMINAL DP: </text>
        <text x="290" y="103" font-family="'Outfit', sans-serif" font-size="14px" font-weight="900" fill="#065f46">Rp 100.000</text>

        <!-- Proof Upload -->
        <rect x="18" y="122" width="370" height="22" fill="#ffffff" opacity="0.2" rx="6"/>
        <text x="130" y="137" font-family="'Inter', sans-serif" font-size="9px" font-weight="800" fill="#ffffff">📎 Klik Upload Bukti Transfer (Opsional)</text>
      </g>
    </g>

    <!-- RIGHT COLUMN: Items & Reference Photos -->
    <g transform="translate(470, 85)">
      <text x="0" y="15" class="text-label" fill="#065f46">📦 KONFIRMASI BARANG &amp; FOTO REFERENSI WORKSHOP</text>

      <!-- Item Card 1 -->
      <g transform="translate(0, 26)">
        <rect width="420" height="135" class="card-item" stroke="#22af85" stroke-width="1.5"/>
        <text x="16" y="24" font-family="'Outfit', sans-serif" font-size="14px" font-weight="900" fill="#0f172a">Nike Air Force 1 '07</text>
        <text x="16" y="38" font-family="'Inter', sans-serif" font-size="9.5px" font-weight="700" fill="#10b981">Sepatu (S) • Putih • Size 42 • 3 HK</text>
        <text x="320" y="25" font-family="'Outfit', sans-serif" font-size="13px" font-weight="900" fill="#065f46">Rp 150.000</text>

        <!-- Service Badges -->
        <rect x="16" y="48" width="85" height="18" fill="#0f172a" rx="6"/>
        <text x="22" y="60" font-family="'Inter', sans-serif" font-size="8px" font-weight="900" fill="#ffffff">DEEP CLEANING</text>
        <rect x="108" y="48" width="85" height="18" fill="#0f172a" rx="6"/>
        <text x="114" y="60" font-family="'Inter', sans-serif" font-size="8px" font-weight="900" fill="#ffffff">REPAINT SOLE</text>

        <!-- Photo Uploader Section -->
        <line x1="16" y1="74" x2="404" y2="74" stroke="#f1f5f9" stroke-width="1"/>
        <text x="16" y="88" class="text-label" font-size="8px">FOTO REFERENSI SEPATU SEBELUM PRODUKSI (OPSIONAL):</text>
        
        <!-- Thumbnail Boxes -->
        <rect x="16" y="96" width="32" height="32" rx="6" fill="#e2e8f0"/>
        <text x="23" y="115" font-size="10px">👟</text>
        <rect x="54" y="96" width="32" height="32" rx="6" fill="#e2e8f0"/>
        <text x="61" y="115" font-size="10px">📸</text>
        
        <rect x="94" y="96" width="90" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3,3"/>
        <text x="104" y="115" font-family="'Inter', sans-serif" font-size="8.5px" font-weight="800" fill="#64748b">+ Tambah Foto</text>
      </g>

      <!-- Item Card 2 -->
      <g transform="translate(0, 172)">
        <rect width="420" height="135" class="card-item"/>
        <text x="16" y="24" font-family="'Outfit', sans-serif" font-size="14px" font-weight="900" fill="#0f172a">Converse Chuck 70 Hi</text>
        <text x="16" y="38" font-family="'Inter', sans-serif" font-size="9.5px" font-weight="700" fill="#10b981">Sepatu (S) • Hitam • Size 41 • 2 HK</text>
        <text x="330" y="25" font-family="'Outfit', sans-serif" font-size="13px" font-weight="900" fill="#065f46">Rp 85.000</text>

        <rect x="16" y="48" width="85" height="18" fill="#0f172a" rx="6"/>
        <text x="22" y="60" font-family="'Inter', sans-serif" font-size="8px" font-weight="900" fill="#ffffff">UNYELLOWING</text>

        <line x1="16" y1="74" x2="404" y2="74" stroke="#f1f5f9" stroke-width="1"/>
        <text x="16" y="88" class="text-label" font-size="8px">FOTO REFERENSI SEPATU SEBELUM PRODUKSI (OPSIONAL):</text>
        
        <rect x="16" y="96" width="90" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3,3"/>
        <text x="26" y="115" font-family="'Inter', sans-serif" font-size="8.5px" font-weight="800" fill="#64748b">+ Tambah Foto</text>
      </g>
    </g>

    <!-- Modal Footer -->
    <g transform="translate(0, 440)">
      <line x1="0" y1="0" x2="920" y2="0" stroke="#f1f5f9" stroke-width="1.5"/>
      
      <!-- Total Section -->
      <g transform="translate(30, 20)">
        <text x="0" y="14" class="text-label">TOTAL TAGIHAN</text>
        <text x="0" y="38" font-family="'Outfit', sans-serif" font-size="24px" font-weight="900" fill="#0f172a">Rp 235.000</text>
      </g>

      <g transform="translate(180, 20)">
        <text x="0" y="14" class="text-label" fill="#10b981">SISA PEMBAYARAN</text>
        <text x="0" y="38" font-family="'Outfit', sans-serif" font-size="24px" font-weight="900" fill="#10b981">Rp 135.000</text>
      </g>

      <!-- Action Buttons -->
      <g transform="translate(560, 16)">
        <!-- Cancel Button -->
        <rect width="80" height="48" fill="#f1f5f9" rx="12"/>
        <text x="24" y="30" font-family="'Inter', sans-serif" font-size="11px" font-weight="800" fill="#64748b">BATAL</text>

        <!-- Submit Button (1-Click Unified) -->
        <g transform="translate(95, 0)">
          <rect width="235" height="48" class="btn-submit"/>
          <text x="20" y="29" font-family="'Outfit', sans-serif" font-size="13px" font-weight="900" fill="#ffffff">🚀 TERBITKAN &amp; SERAHKAN</text>
        </g>
      </g>
    </g>
  </g>
</svg>
